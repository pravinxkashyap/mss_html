<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Contact Us | Master Software Solutions</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Arial, sans-serif;
      background: #faf6f3;
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 24px;
      color: #2a2320;
    }
    .wrap { width: 100%; max-width: 620px; }
    .brand { font-size: 21px; font-weight: 800; margin-bottom: 6px; color: #2a2320; }
    .brand b { color: #e8623f; }
    .lead { font-size: 14px; color: #6a5d56; margin-bottom: 18px; }

    .card {
      background: #fff;
      border-radius: 12px;
      padding: 30px;
      box-shadow: 0 8px 30px rgba(70,40,20,0.08);
      border-top: 4px solid #e8623f;
    }
    .card h3 { font-size: 22px; color: #2a2320; margin-bottom: 4px; }
    .card .sub { font-size: 13px; color: #8a7d76; margin-bottom: 22px; }

    .field { margin-bottom: 15px; }
    label { display: block; font-size: 12px; font-weight: 600; color: #4a403a; margin-bottom: 5px; }
    label .req { color: #e53935; }
    input, select, textarea {
      width: 100%; padding: 11px 13px; border: 1px solid #e0d6cf; border-radius: 6px;
      font-size: 14px; font-family: inherit; background: #fff; color: #222;
    }
    input:focus, select:focus, textarea:focus {
      outline: none; border-color: #e8623f; box-shadow: 0 0 0 3px rgba(232,98,63,0.13);
    }
    textarea { min-height: 110px; resize: vertical; }
    .phone-grp { display: flex; gap: 8px; }
    .phone-grp select { flex: 0 0 150px; }
    .phone-grp input { flex: 1; }

    button {
      margin-top: 8px; background: #e8623f; color: #fff; border: none;
      padding: 12px 32px; font-size: 15px; font-weight: 700; border-radius: 6px; cursor: pointer;
    }
    button:hover { background: #d4502f; }
    button:disabled { opacity: .6; cursor: not-allowed; }

    .status { margin-top: 14px; font-size: 13px; min-height: 18px; }
    .status.ok { color: #2e7d32; }
    .status.err { color: #d32f2f; }
    .status.pending { color: #8a7d76; }
  </style>
</head>
<body>
  <div class="wrap">
    <div class="brand">Master <b>Software Solutions</b></div>
    <div class="lead">Let's get connected — transform your business with us. Share your business details and our experts will discuss your challenges and goals.</div>

    <div class="card">
      <h3>Contact Us</h3>
      <div class="sub">Tell us about your project and we'll get back to you shortly.</div>

      <form id="leadForm">
        <div class="field">
          <label>Name <span class="req">*</span></label>
          <input type="text" name="name" required>
        </div>

        <div class="field">
          <label>Email <span class="req">*</span></label>
          <input type="email" name="email" required>
        </div>

        <div class="field">
          <label>Phone <span class="req">*</span></label>
          <div class="phone-grp">
            <select id="country" name="country" required>
              <option value="India" data-code="+91" selected>India (+91)</option>
              <option value="United States" data-code="+1">United States (+1)</option>
              <option value="Canada" data-code="+1">Canada (+1)</option>
              <option value="United Kingdom" data-code="+44">United Kingdom (+44)</option>
              <option value="Australia" data-code="+61">Australia (+61)</option>
              <option value="United Arab Emirates" data-code="+971">UAE (+971)</option>
              <option value="Saudi Arabia" data-code="+966">Saudi Arabia (+966)</option>
              <option value="Germany" data-code="+49">Germany (+49)</option>
              <option value="Singapore" data-code="+65">Singapore (+65)</option>
              <option value="Ireland" data-code="+353">Ireland (+353)</option>
              <option value="Other" data-code="">Other</option>
            </select>
            <input type="tel" id="phone" name="phone_number" placeholder="Phone" required>
          </div>
        </div>

        <div class="field">
          <label>Business Name</label>
          <input type="text" name="company_name">
        </div>

        <div class="field">
          <label>Message</label>
          <textarea name="message" placeholder="Tell us about your requirements"></textarea>
        </div>

        <input type="hidden" name="source" value="mss">

        <button type="submit" id="submitBtn">Submit</button>
        <div class="status" id="status"></div>
      </form>
    </div>
  </div>

  <script>
    const ENDPOINT = "https://lead-automation.staging02.com/submit";

    const form = document.getElementById('leadForm');
    const statusEl = document.getElementById('status');
    const btn = document.getElementById('submitBtn');

    form.addEventListener('submit', async (e) => {
      e.preventDefault();

      // Block submission until every required field is valid (shows native prompts)
      if (!form.reportValidity()) return;

      const data = Object.fromEntries(new FormData(form).entries());
      const countrySel = document.getElementById('country');
      const code = countrySel.selectedOptions[0].getAttribute('data-code') || '';
      if (data.phone_number) data.phone_number = (code ? code + ' ' : '') + data.phone_number;
      data.submitted_at = new Date().toISOString();

      statusEl.textContent = 'Sending...';
      statusEl.className = 'status pending';
      btn.disabled = true;

      try {
        const res = await fetch(ENDPOINT, {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify(data)
        });
        const out = await res.json().catch(() => ({ ok: res.ok }));
        if (res.ok && out.ok !== false) {
          statusEl.textContent = 'Thank you! Our team will reach out shortly.';
          statusEl.className = 'status ok';
          form.reset();
        } else {
          statusEl.textContent = 'Something went wrong: ' + (out.error || res.status);
          statusEl.className = 'status err';
        }
      } catch (err) {
        statusEl.textContent = 'Could not reach the server: ' + err.message;
        statusEl.className = 'status err';
      } finally {
        btn.disabled = false;
      }
    });
  </script>
</body>
</html>
