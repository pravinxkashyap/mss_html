<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Master Software Solutions — Contact Us</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
      background: #111827; min-height: 100vh;
      display: flex; align-items: center; justify-content: center; padding: 40px 20px;
    }
    .card {
      background: #1f2937; border-radius: 14px; padding: 44px 40px;
      max-width: 680px; width: 100%; box-shadow: 0 8px 40px rgba(0,0,0,0.5);
    }
    .brand { display: flex; align-items: center; gap: 10px; margin-bottom: 8px; }
    .brand-logo { width: 40px; height: 40px; }
    .brand-logo svg { width: 40px; height: 40px; }
    .eyebrow { font-size: 13px; color: #9ca3af; margin-bottom: 6px; }
    h1 { font-size: 26px; font-weight: 700; color: white; margin-bottom: 6px; }
    .subtitle { font-size: 14px; color: #9ca3af; margin-bottom: 6px; }
    .email-link { color: #ea580c; font-size: 14px; margin-bottom: 28px; display: block; }
    .row { display: grid; grid-template-columns: 1fr 1fr; gap: 14px; }
    .field { margin-bottom: 18px; }
    label { display: block; font-size: 13px; font-weight: 600; color: #d1d5db; margin-bottom: 6px; }
    .req { color: #ef4444; }
    input, select, textarea {
      width: 100%; padding: 11px 14px;
      background: #374151; border: 1.5px solid #4b5563;
      border-radius: 8px; font-size: 14px; color: white;
      outline: none; transition: border-color 0.2s; font-family: inherit;
    }
    input::placeholder, textarea::placeholder { color: #6b7280; }
    select option { background: #374151; color: white; }
    input:focus, select:focus, textarea:focus { border-color: #ea580c; }
    .phone-row { display: grid; grid-template-columns: 170px 1fr; gap: 10px; }
    textarea { resize: vertical; min-height: 110px; }
    button {
      background: #ea580c; color: white; border: none;
      padding: 13px 32px; border-radius: 8px;
      font-size: 15px; font-weight: 700; cursor: pointer; transition: background 0.2s;
    }
    button:hover { background: #c2410c; }
    button:disabled { background: #6b3a2a; cursor: not-allowed; }
    .status {
      margin-top: 16px; padding: 12px 16px; border-radius: 8px;
      font-size: 14px; display: none;
    }
    .status.success { background: #064e3b; color: #6ee7b7; border: 1px solid #065f46; }
    .status.error   { background: #7f1d1d; color: #fca5a5; border: 1px solid #991b1b; }
  </style>
</head>
<body>
<div class="card">
  <div class="brand">
    <!-- MSS swirl logo in SVG -->
    <svg class="brand-logo" viewBox="0 0 40 40" xmlns="http://www.w3.org/2000/svg">
      <circle cx="14" cy="20" r="10" fill="none" stroke="#06b6d4" stroke-width="3"/>
      <circle cx="26" cy="20" r="10" fill="none" stroke="#ea580c" stroke-width="3"/>
    </svg>
  </div>
  <h1>Transform your Business with us</h1>
  <p class="subtitle">Share your business details and get all your questions answered by our experts. Let's discuss your challenges, goals and ways to move towards sustainable growth.</p>
  <a class="email-link" href="mailto:info@mastersoftwaresolutions.com">You can also drop us a direct email at info@mastersoftwaresolutions.com</a>

  <form id="form">
    <div class="row">
      <div class="field">
        <label>Name <span class="req">*</span></label>
        <input name="name" type="text" placeholder="Sarah Johnson" required>
      </div>
      <div class="field">
        <label>Email <span class="req">*</span></label>
        <input name="email" type="email" placeholder="sarah@company.com" required>
      </div>
    </div>
    <div class="row">
      <div class="field">
        <label>Phone Number</label>
        <div class="phone-row">
          <select name="phone_country">
            <option value="IN">India (भारत) +91</option>
            <option value="CA">Canada +1</option>
            <option value="US">United States +1</option>
            <option value="GB">United Kingdom +44</option>
            <option value="AU">Australia +61</option>
            <option value="AE">UAE +971</option>
          </select>
          <input name="phone_number" type="tel" placeholder="+91">
        </div>
      </div>
      <div class="field">
        <label>Business Name</label>
        <input name="business_name" type="text" placeholder="Acme Manufacturing Inc.">
      </div>
    </div>
    <div class="field">
      <label>Message</label>
      <textarea name="message" placeholder="We're looking for an ERP solution for our manufacturing operations..."></textarea>
    </div>
    <button type="submit" id="btn">Submit</button>
  </form>
  <div class="status" id="status"></div>
</div>
<script>
const SUBMIT_URL = 'https://teddy-linux-elderly-arbitrary.trycloudflare.com';
document.getElementById('form').addEventListener('submit', async (e) => {
  e.preventDefault();
  const btn = document.getElementById('btn');
  const statusEl = document.getElementById('status');
  btn.disabled = true; btn.textContent = 'Sending…';
  const data = Object.fromEntries(new FormData(e.target).entries());
  data.source = 'mss';
  try {
    await fetch(SUBMIT_URL, {
      method: 'POST', headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify(data)
    });
    statusEl.className = 'status success';
    statusEl.textContent = '✅ Pipeline triggered — lead sent to automation.';
    statusEl.style.display = 'block';
    e.target.reset();
  } catch (err) {
    statusEl.className = 'status error';
    statusEl.textContent = '⚠️ Could not reach server: ' + err.message;
    statusEl.style.display = 'block';
  }
  btn.disabled = false; btn.textContent = 'Submit';
});
</script>
</body>
</html>
